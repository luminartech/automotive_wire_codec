# Standalone-workspace marker: awc has no [workspace] of its own members,
# but without this table, a consumer that depends on awc by path (as the
# in-repo migration branches do) silently absorbs this directory into the
# CONSUMER's cargo workspace. That is not theoretical: a `cargo fmt --all`
# run inside a consumer once reformatted files in this repo. An empty
# [workspace] table makes this Cargo.toml its own workspace root so cargo
# stops walking up looking for one to join.
[workspace]

[package]
name = "automotive-wire-codec"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Zero-copy, no_std, no-alloc binary codec traits for automotive diagnostic protocols"
repository = "https://github.com/luminartech/automotive_wire_codec"
homepage = "https://github.com/luminartech/automotive_wire_codec"
keywords = ["no-std", "embedded", "automotive", "codec", "zero-copy"]
categories = ["no-std", "no-std::no-alloc", "embedded", "encoding", "parser-implementations"]
# Root is now the crate root, so keep repo tooling out of the published tarball.
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "Cargo.toml",
    "README.md",
    "MIGRATION.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]

[dev-dependencies]
proptest = "1.5"

[lints.rust]
unsafe_code = "forbid"
